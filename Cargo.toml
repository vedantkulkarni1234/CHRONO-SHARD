[package]
name = "chrono-shard"
version = "0.1.0"
edition = "2021"
authors = ["CHRONO-SHARD DFIR Team"]
description = "Blazing-fast terminal digital forensics time-machine with dual-model Gemini AI MITRE ATT&CK correlation"
license = "MIT OR Apache-2.0"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
rayon = "1.10"
walkdir = "2.5"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures = "0.3"
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
uuid = { version = "1.11", features = ["v4"] }
anyhow = "1.0"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
